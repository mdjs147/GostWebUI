name: Bug 报告
description: 报告可复现的功能异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除真实公网地址、用户名、密码、Token、代理订阅和完整规则文件。
        安全漏洞请使用仓库 Security 页的私密报告入口，不要创建公开 Issue。

  - type: input
    id: version
    attributes:
      label: GostWebUI 版本
      placeholder: 例如 2.1.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 转发模式
      options:
        - 普通 TCP 转发（gost）
        - MySQL TLS 中继
        - 与转发模式无关
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定、已脱敏的复现步骤。
      placeholder: |
        1. 打开……
        2. 配置……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 可选。不要粘贴凭据、订阅、完整配置或真实目标地址。
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除凭据、订阅、真实目标地址和其他隐私信息。
          required: true
